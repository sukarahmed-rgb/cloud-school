version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - 'firebase-tools'
          - 'wrangler'
          - '@lhci/cli'
          - 'vite'
          - 'typescript'
          - 'eslint*'
          - 'prettier'
          - 'playwright*'
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: '@lhci/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: 'live-server'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'dependencies'
