name: CI/CD

on:
  workflow_dispatch:
    inputs:
      deployProduction:
        description: 'Deploy after release checklist and owner approval'
        type: boolean
        default: false
      deployPreview:
        description: 'Deploy isolated preview after owner approval'
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 scripts/security/release_check.py
      - run: python3 scripts/security/test_backup.py
      - name: Dependency release gate
        run: npm audit --audit-level=high
      - name: Archive full dependency findings
        if: always()
        run: npm audit --json > dependency-audit.json || test -s dependency-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jest-coverage
          path: coverage/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --reporter=list
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run lighthouse
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.deployPreview
    needs: [test, e2e, build, security-gate]
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
      - name: Deploy approved preview
        run: npx firebase hosting:channel:deploy review-${{ github.run_id }} --project cloud-school-6251a
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
      - name: Remove credentials
        if: always()
        run: rm -f service-account.json

  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deployProduction
    environment: production
    needs: [test, e2e, build, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cloud-school-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deployProduction
    environment: production
    needs: [test, e2e, build, lighthouse, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
      - run: npx firebase deploy --only hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
      - name: Remove credentials
        if: always()
        run: rm -f service-account.json
